[project]
name = "airwer"
version = "0.1.0"
description = "Word Error Rate for Air Traffic Control"
authors = [
    {name = "James Ding", email = "james@twango.dev"},
]
dependencies = [
    "jiwer>=4.0,<5",
]
requires-python = ">=3.9"
readme = "README.md"
license = {text = "Apache-2.0"}
keywords = ["wer", "asr", "atc", "air-traffic-control", "speech-recognition", "jiwer", "normalization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/twangodev/airwer"
Issues = "https://github.com/twangodev/airwer/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airwer"]

[dependency-groups]
dev = [
    "poethepoet>=0.32.0",
    "pre-commit>=4.0.0",
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "ruff>=0.14.3",
    "ty>=0.0.2",
]

[tool.ty.src]
exclude = ["tests/"]

[tool.ruff.lint]
extend-select = [
    "F",        # Pyflakes rules
    "W",        # PyCodeStyle warnings
    "E",        # PyCodeStyle errors
    "I",        # Sort imports properly
    "UP",       # Warn if certain things can changed due to newer Python versions
    "C4",       # Catch incorrect use of comprehensions, dict, list, etc
    "FA",       # Enforce from __future__ import annotations
    "ISC",      # Good use of string concatenation
    "ICN",      # Use common import conventions
    "RET",      # Good return practices
    "SIM",      # Common simplification rules
    "TID",      # Some good import practices
    "TC",       # Enforce importing certain types in a TYPE_CHECKING block
    "PTH",      # Use pathlib instead of os.path
    "NPY",      # Some numpy-specific things
]
ignore = [
    "E501",     # Line too long (handled by ruff format)
]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.poe.tasks]
lint = "ruff check ."
format = "ruff format --check ."
typecheck = "ty check"
check = ["lint", "format", "typecheck"]

lint-fix = "ruff check --fix ."
format-fix = "ruff format ."
fix = ["lint-fix", "format-fix"]

test = "pytest tests/unit/ -v --cov=src/airwer --cov-report=xml --cov-report=term"

[tool.poe.tasks.build]
cmd = "uv build"
executor = {type = "simple"}
